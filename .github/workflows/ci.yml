---
name: CI

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "app/**"
      - "bin/**"
      - "config/**"
      - "db/**"
      - "lib/**"
      - "public/**"
      - "spec/**"
      - "vendor/**"
      - "**.yml"
      - "**.ts"
      - "Dockerfile"
      - "Gemfile.lock"
      - "yarn.lock"
      - "package.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "hk.pkl"
      - "mise.toml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # JOB to run change detection
  changes:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      deployment: ${{ steps.filter.outputs.deployment }}
      test: ${{ steps.filter.outputs.test }}
      js: ${{ steps.filter.outputs.js }}
      ruby: ${{ steps.filter.outputs.ruby }}
      hooks: ${{ steps.filter.outputs.hooks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            js:
              - "**/*.js"
              - "**/*.ts"
              - "app/javascript/**"
              - "*.yml"
              - "package.json"
              - "tsconfig.json"
              - "eslint.config.js"
              - "yarn.lock"
            ruby:
              - "**.rb"
              - "**.erb"
              - "**.yml"
              - "Gemfile"
              - "Gemfile.lock"
            # hk.pkl defines what the hooks job runs, so changing it must
            # re-run those checks.
            hooks:
              - "hk.pkl"
              - ".hk-hooks/**"
              - "scripts/**"
            test:
              - "spec/**"
            deployment:
              - ".github/workflows/ci.yml"
              - "app/**"
              - "bin/docker-entrypoint"
              - "config/**"
              - "db/**"
              - "lib/**"
              - "public/**"
              - "vendor/**"
              - ".node-version"
              - ".ruby-version"
              - "config.ru"
              - "Dockerfile"
              - "Gemfile.lock"
              - "package.json"
              - "yarn.lock"

      - name: Summarize change detection
        if: always()
        run: |
          {
            echo "## Change detection"
            echo ""
            echo "| Filter | Result |"
            echo "| --- | --- |"
            echo "| deployment | ${{ steps.filter.outputs.deployment }} |"
            echo "| test | ${{ steps.filter.outputs.test }} |"
            echo "| js | ${{ steps.filter.outputs.js }} |"
            echo "| ruby | ${{ steps.filter.outputs.ruby }} |"
            echo "| hooks | ${{ steps.filter.outputs.hooks }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  scan_ruby:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ruby == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        id: brakeman
        run: |
          mkdir -p tmp
          bin/brakeman --no-pager --format markdown --output tmp/brakeman.md

      - name: Summarize Brakeman scan
        if: always()
        run: |
          {
            echo "## Brakeman scan"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Brakeman | ${{ steps.brakeman.outcome }} |"
            echo ""
            echo "### Brakeman report"
            echo ""
            if [ -f tmp/brakeman.md ]; then
              cat tmp/brakeman.md
            else
              echo "No Brakeman report was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  scan_js:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Scan for security vulnerabilities in JavaScript dependencies
        id: audit
        run: yarn npm audit

      - name: Summarize JavaScript audit
        if: always()
        run: |
          {
            echo "## JavaScript audit"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| yarn npm audit | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint_js:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.js == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      # esbuild strips TypeScript types without checking them, so the build in the
      # test job cannot catch type errors. Only tsc can.
      - name: Typecheck TypeScript
        id: typecheck
        run: yarn typecheck

      - name: Lint JavaScript and TypeScript
        id: eslint
        if: always()
        run: yarn lint

      - name: Check formatting
        id: prettier
        if: always()
        run: yarn format:check

      - name: Summarize JavaScript lint
        if: always()
        run: |
          {
            echo "## JavaScript lint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| tsc | ${{ steps.typecheck.outcome }} |"
            echo "| ESLint | ${{ steps.eslint.outcome }} |"
            echo "| Prettier | ${{ steps.prettier.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ruby == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        id: standardrb
        uses: standardrb/standard-ruby-action@eecb3f730879f5b8830705348c2961e5aa26de78 # v1.5.0
        with:
          autofix: false

      - name: Summarize Ruby lint
        if: always()
        run: |
          {
            echo "## Ruby lint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| StandardRB | ${{ steps.standardrb.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Backstop for the checks defined in hk.pkl (erb_lint, yamllint, typos,
  # gitleaks, whitespace). These otherwise run only in local git hooks, so a
  # contributor without hk installed — or a single --no-verify — bypasses them
  # entirely. Running the same hook definition here keeps CI from drifting from
  # local: hk.pkl remains the single source of truth.
  hooks:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.ruby == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.hooks == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # gitleaks and the hk file resolution need full history, not a shallow clone.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Run hk checks
        id: hk
        env:
          # Check, never fix: CI must fail on violations rather than silently
          # rewriting files.
          HK_FIX: "0"
        # --stash none because hk.pkl configures stash = "git", which needs a
        # git identity to create the stash commit; runners have none. There are
        # no unstaged changes to protect in CI, so stashing is pure overhead.
        run: hk run pre-commit --all --stash none

      - name: Summarize hook checks
        if: always()
        run: |
          {
            echo "## Hook checks (hk)"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| hk run pre-commit --all | ${{ steps.hk.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployment == 'true' || needs.changes.outputs.test == 'true' }}

    services:
      redis:
        image: redis:8.10.0-alpine@sha256:5cca2f8a01ef2264c52dac86f14ec6a5abe973a93331e1b62522cfc5e63e4691
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: |
          sudo apt-get update && \
          sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips sqlite3

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Run tests
        id: tests
        env:
          RAILS_ENV: test
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:setup spec

      - name: Keep screenshots from failed system tests
        id: screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore

      - name: Summarize tests
        if: always()
        run: |
          {
            echo "## Test run"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| RSpec | ${{ steps.tests.outcome }} |"
            echo "| Screenshots artifact | ${{ steps.screenshots.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.deployment == 'true' }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Node.js musl build availability
        run: |
          NODE_VERSION=$(cat .node-version)
          MUSL_URL="https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64-musl.tar.gz"
          echo "Checking for Node.js musl build at: ${MUSL_URL}"
          if ! curl --output /dev/null --silent --head --fail "${MUSL_URL}"; then
            echo "::error::Node.js v${NODE_VERSION} musl build is not yet available at ${MUSL_URL}"
            echo "This typically happens when a new Node.js version is released but unofficial builds haven't been generated yet."
            echo "Please wait for the musl build to become available, or revert to the previous Node.js version."
            exit 1
          fi
          echo "Node.js v${NODE_VERSION} musl build is available"

      - name: Compute release tag
        id: release_tag
        run: |
          DATE=$(date +'%Y.%m.%d')
          # Fetch all tags to check for existing tags today
          git fetch --tags
          # Count existing tags for today and increment
          COUNT=$(git tag -l "v${DATE}.*" | wc -l)
          NEXT=$((COUNT + 1))
          TAG_NAME="v${DATE}.${NEXT}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ steps.release_tag.outputs.tag }},enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            maintainer=Pedro Pombeiro
            org.opencontainers.image.title=GitLab MR Dashboard
            org.opencontainers.image.description=A productivity-focused MR dashboard for GitLab
            org.opencontainers.image.vendor=Pedro Pombeiro

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "GIT_REPO_COMMIT_SHA=${{ github.sha }}"
            "GIT_RELEASE_TAG=${{ steps.release_tag.outputs.tag }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create Git tag
        if: steps.push.outputs.digest != '' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAG_NAME="${{ steps.release_tag.outputs.tag }}"

          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          echo "Created and pushed tag $TAG_NAME"

      - name: Summarize image build
        if: always()
        run: |
          TAGS="${{ steps.meta.outputs.tags }}"
          TAGS=${TAGS//$'\n'/<br>}
          {
            echo "## Container image"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Release tag | ${{ steps.release_tag.outputs.tag }} |"
            echo "| Image tags | ${TAGS} |"
            echo "| Digest | ${{ steps.push.outputs.digest }} |"
            echo "| Build result | ${{ steps.push.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
